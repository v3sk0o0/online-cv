career-profile:
    title: $ whoami
    summary: |
      As a passionate software engineer based in Sofia, I enjoy turning
      complex problems into simple, creative and intuitive solutions.
      I'm open to explore new technologies outside my comfort zone. I’m a strong team player who always acts with integrity. When conflicts arise, I get down to first principles. I value the most at my workspace - honesty, autonomy and ownership.

      I'm curious about learning new skills and abilities. My latest endeavor is learning to ride a longboard.
      Since a couple years ago, I've started listening to a lot of podcasts.
      I would wholeheartedly recommend [Radiolab](https://www.wnycstudios.org/podcasts/radiolab)​,
      [99% Invisible](https://99percentinvisible.org/) and [Benjamin Walker’s theory of everything​](https://www.radiotopia.fm/podcasts/theory-of-everything).


